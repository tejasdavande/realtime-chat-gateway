services:
  api:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      MONGO_URI: mongodb://mongo:27017/chat
    depends_on:
      - redis
      - mongo

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
